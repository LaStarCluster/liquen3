    this.audio.synth.oneShotOrigin();
    this.audio.mix(0, 0.75, 5);   // crossfade ≤ 5 s bosque -> sintetizador
  }

  animateFauna(t) {
    const c = this.fauna.chucao, b = this.fauna.ciervo, r = this.fauna.ranita;
    c.position.y = FAUNA_POS.chucao.y + Math.max(0, Math.sin(t * 2.2)) * 0.04 * (Math.sin(t * 0.7) > 0.6 ? 1 : 0);
    b.rotation.y = Math.atan2(-FAUNA_POS.ciervo.x, -FAUNA_POS.ciervo.z) + Math.sin(t * 0.4) * 0.3;
    r.scale.y = r.scale.x * (1 + 0.06 * Math.max(0, Math.sin(t * 5)));
  }

  updateTimeline(pos, t, dt) {
    approach(this.tlAlpha, 1, 3, dt);
    this.applyTimelineAlpha(this.tlAlpha.value);
    const x = -0.3 + 0.6 * pos;
    this.tlMarker.position.set(x, 0, 0.001);
    this.tlFill.scale.x = Math.max(0.0001, pos); this.tlFill.position.x = -0.3 + 0.3 * pos;
    this.tlNow.position.x = x;
    this.tlLabelClock -= dt;
    if (this.tlLabelClock <= 0) {   // máx. 10 redibujos/s
      this.tlLabelClock = 0.1;
      const ma = 400 * (1 - pos);
      let txt;
      if (pos >= 0.9995 || t >= 49.7) txt = 'hoy';
      else if (ma >= 10) txt = `${Math.round(ma)} Ma`;
      else if (ma >= 0.1) txt = `${ma.toFixed(1).replace('.', ',')} Ma`;
      else txt = `${ma.toFixed(2).replace('.', ',')} Ma`;
      this.tlNow.setText(txt);
    }
  }
  applyTimelineAlpha(a) { this.tlMats.forEach((m, i) => (m.opacity = a * (i === 0 ? 0.6 : 1))); this.timeline.visible = a > 0.01; }

  /* ---------- interacción ---------- */
  actionOf(obj) {
    for (let o = obj; o; o = o.parent) if (o.userData?.action) return o;
    return null;
  }
  // event.target es el Script que recibe el evento; la superficie golpeada es event.surface.
  onObjectSelectStart(event) {
    const o = this.actionOf(event.surface || event.intersection?.object);
    if (!o || !this.running) return;
    event.stopPropagation();
    const a = o.userData.action;
    if (a === 'next') this.navigate(1);
    else if (a === 'prev') this.navigate(-1);
    else if (a === 'lichen' && this.cur === 0 && this.t > 8.5) this.selectLichen(o.userData.index);
    else if (a === 'cell' && this.cur === 2) { if (this.manip) this.endManip(); else this.startManip(event.source); }
  }
  onHoverEnter(event) {
    const o = this.actionOf(event.surface || event.intersection?.object); if (!o) return;
    const a = o.userData.action;
    if (a === 'lichen') this.lichen.material.uniforms.uHover.value = o.userData.index;
    if (this.navBtns[a]) { this.navBtns[a].g.scale.setScalar(1.35); this.navBtns[a].icon.material.opacity = 1; }
  }
  onHoverExit(event) {
    const o = this.actionOf(event.surface || event.intersection?.object); if (!o) return;
    const a = o.userData.action;
    if (a === 'lichen') this.lichen.material.uniforms.uHover.value = -1;
    if (this.navBtns[a]) { this.navBtns[a].g.scale.setScalar(1); this.navBtns[a].icon.material.opacity = 0.55; }
  }
  onSqueezeStart() { if (this.manip) this.endManip(); }   // control de salida de la manipulación
  onKeyDown(event) {
    if (event.code === 'ArrowRight') this.navigate(1);
    else if (event.code === 'ArrowLeft') this.navigate(-1);
    else if (event.code === 'Escape' && this.manip) this.endManip();
  }

  rayAngles(ci) {
    const ray = xb.user.getRay(ci, this.tmpRay); const d = ray.direction;
    if (d.lengthSq() < 0.5) return null;
    return [Math.atan2(d.x, -d.z), Math.asin(THREE.MathUtils.clamp(d.y, -1, 1))];
  }
  startManip(source) {
    const ci = xb.user.controllers?.indexOf(source?.controller) ?? -1;
    const ang = ci >= 0 ? this.rayAngles(ci) : null;
    if (!ang) return;
    this.manip = {ci, last: ang};
    this.hintDone = true;
    this.sym.u.uMerge.value = 0.3;   // retroalimentación visual
  }
  endManip() { this.manip = null; }
  updateManip() {
    if (!this.manip) return;
    const ang = this.rayAngles(this.manip.ci);
    if (!ang) return;
    const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
    const dy = THREE.MathUtils.clamp(wrap(ang[0] - this.manip.last[0]), -0.15, 0.15);
    const dp = THREE.MathUtils.clamp(ang[1] - this.manip.last[1], -0.15, 0.15);
    this.manip.last = ang;
    this.symRot.tYaw += dy * 2.5;
    this.symRot.tPitch = THREE.MathUtils.clamp(this.symRot.tPitch - dp * 2.5, -1.1, 1.1);   // límites estables
  }

  // Botones A/X = avanzar, B/Y = retroceder, joystick izq./der. (API WebXR estándar).
  pollGamepads() {
    const session = xb.core.renderer?.xr?.getSession?.();
    if (!session) return;
    for (const src of session.inputSources) {
      const gp = src.gamepad; if (!gp) continue;
      const prev = this.padPrev.get(src) || {a: false, b: false, stick: 0};
      const a = !!gp.buttons[4]?.pressed, b = !!gp.buttons[5]?.pressed;
      const x = gp.axes.length > 2 ? gp.axes[2] : 0;
      const stick = x > 0.75 ? 1 : x < -0.75 ? -1 : (Math.abs(x) < 0.3 ? 0 : prev.stick);
      if (a && !prev.a) this.navigate(1);
      if (b && !prev.b) this.navigate(-1);
      if (stick !== 0 && stick !== prev.stick) this.navigate(stick);
      this.padPrev.set(src, {a, b, stick});
    }
  }

  followHud(dt) {
    const yaw = this.camYaw();
    let d = Math.atan2(Math.sin(yaw - this.hudYaw), Math.cos(yaw - this.hudYaw));
    if (Math.abs(d) > 0.5 || this.hudCatch) { this.hudCatch = Math.abs(d) > 0.05; this.hudYaw += d * (1 - Math.exp(-4 * dt)); }
    for (const g of [this.hud, this.nav]) { g.position.copy(this.camPos); g.rotation.set(0, this.hudYaw, 0); }
  }

  // Degradación visual si el rendimiento cae (se conserva lo narrativo esencial).
  monitor(dt) {
    this.dtAvg = lerp(this.dtAvg, dt, 0.05);
    if (this.dtAvg > 1 / 55) this.slowTime += dt; else this.slowTime = Math.max(0, this.slowTime - dt * 0.5);
    if (this.slowTime > 3 && this.quality < 2) {
      this.quality++; this.slowTime = 0;
      const f = this.quality === 1 ? 0.65 : 0.4;
      for (const pts of [this.spores, this.net.flow, this.lichen]) pts.geometry.setDrawRange(0, Math.floor(pts.geometry.attributes.position.count * f));
      if (this.quality === 2) this.forest.fern.visible = false;
      console.info('[LIQUEN] Calidad reducida a nivel', this.quality);
    }
  }

  update() {
    const now = performance.now() / 1000;
    const dt = Math.min(0.25, Math.max(0, now - this.last)); this.last = now;
    U.uTime.value += dt;
    const r = xb.core.renderer;
    if (r?.xr?.isPresenting) {
      const l = r.xr.getBaseLayer?.();
      U.uScale.value = (l?.framebufferHeight || l?.textureHeight || 1700) / 2;
    } else if (r?.domElement) U.uScale.value = r.domElement.height / 2;
    if (!this.running) return;
    this.readCamera();
    if (this.pendingRecenter > 0 && --this.pendingRecenter === 0) this.recenter();
    this.followHud(dt);
    this.pollGamepads();
    this.updateManip();
    this.t += dt;
    const st = this.states[this.cur];
    st.update(this.t, dt);
    if (st.auto && this.t >= CONFIG.durations[this.cur]) this.goTo(this.cur + 1, {soft: true});
    approach(U.uGlobal, 1, 5, dt);
    const fc = U.uFogColor.value;
    xb.core.scene.background = (this.bg ||= new THREE.Color()).setRGB(fc.x * U.uGlobal.value, fc.y * U.uGlobal.value, fc.z * U.uGlobal.value, THREE.SRGBColorSpace);
    this.audio.synth.tick(this.t);
    this.monitor(dt);
  }
}

/* =====================================================================
 * 7. ARRANQUE (robusto en Meta Quest Browser)
 * ===================================================================== */
const landing = document.getElementById('landing');
const startBtn = document.getElementById('start');

/* --- Diagnóstico opcional: solo con ?debug en la URL (no añade texto en el modo normal) --- */
const DEBUG = new URLSearchParams(location.search).has('debug');
let debugBox = null;
if (DEBUG) {
  debugBox = document.createElement('pre');
  debugBox.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:50;max-width:min(560px,90vw);max-height:45vh;overflow:auto;margin:0;padding:10px;background:rgba(0,0,0,.85);color:#9fe8c0;font:12px/1.4 monospace;white-space:pre-wrap;border:1px solid #2de2d0;border-radius:6px';
  document.body.appendChild(debugBox);
  for (const level of ['log', 'info', 'warn', 'error']) {
    const orig = console[level].bind(console);
    console[level] = (...args) => { orig(...args); dlog(level.toUpperCase(), ...args); };
  }
  window.addEventListener('error', (e) => dlog('ERROR', e.message));
  window.addEventListener('unhandledrejection', (e) => dlog('PROMISE', e.reason?.name, e.reason?.message || e.reason));
}
function dlog(...args) {
  if (!debugBox) return;
  const txt = args.map((a) => (a instanceof Error ? `${a.name}: ${a.message}` : typeof a === 'object' ? (() => { try { return JSON.stringify(a); } catch { return String(a); } })() : String(a))).join(' ');
  debugBox.textContent += `${(performance.now() / 1000).toFixed(1)}s ${txt}\n`;
  debugBox.scrollTop = debugBox.scrollHeight;
}
dlog('secureContext', window.isSecureContext, '| iframe', window.self !== window.top, '| navigator.xr', !!navigator.xr,
  '| offerSession', !!navigator.xr?.offerSession, '| UA', navigator.userAgent);

/* --- Evita la "sesión ofrecida" automática ---
 * XR Blocks llama a navigator.xr.offerSession() al iniciarse si el navegador lo admite.
 * En Quest Browser eso deja una solicitud de sesión pendiente que puede hacer fallar la
 * solicitud del botón "Comienza tu viaje". Se oculta solo para esta página. */
if (navigator.xr && navigator.xr.offerSession) {
  try { Object.defineProperty(navigator.xr, 'offerSession', {value: undefined, configurable: true, writable: true}); dlog('offerSession desactivado'); }
  catch (e) { dlog('No se pudo desactivar offerSession', e); }
}

const options = new xb.Options();
options.enableVR();                              // sesión immersive-vr (no passthrough)
options.xrButton.enabled = false;                // botón propio: "Comienza tu viaje"
options.controllers.visualizeRays = true;        // rayo visible desde los mandos
options.simulator.instructions.enabled = false;
options.referenceSpaceType = 'local-floor';
// Meta Quest Browser rechaza la sesión ("NotSupportedError: The specified session configuration
// is not supported") con la lista por defecto de XR Blocks (local-floor, bounded-floor, unbounded).
// La experiencia solo usa 'local-floor', así que se pide únicamente ese espacio de referencia.
options.webxrOptionalFeatures = ['local-floor'];
options.permissions.microphone = false;          // nunca se usa el micrófono

class SessionHooks extends xb.Script {
  onXRSessionStarted() { dlog('Sesión XR iniciada'); starting = false; landing.classList.add('hidden'); app.begin(); }
  onXRSessionEnded() { dlog('Sesión XR terminada'); starting = false; app.stop(); landing.classList.remove('hidden'); startBtn.disabled = false; }
}
const app = new Liquen();
xb.add(app);
xb.add(new SessionHooks());
try { await xb.init(options); dlog('XR Blocks listo'); }
catch (e) { console.warn('[LIQUEN] Inicialización parcial (p. ej., recurso del simulador de escritorio):', e); }
try { xb.core.renderer.xr.setFoveation?.(1); } catch (e) { /* opcional */ }

const mgr = xb.core.webXRSessionManager;
const xrSupported = !!mgr?.isXRSupported?.();
dlog('immersive-vr soportado', xrSupported);

// Si la solicitud de sesión falla, se registra el motivo y el botón queda listo para reintentar.
let starting = false;
mgr?.addEventListener?.('sessionerror', (e) => {
  starting = false; startBtn.disabled = false;
  console.warn('[LIQUEN] Error al iniciar la sesión XR:', e.error?.name, e.error?.message || e.error);
});

// El botón se activa en cuanto XR Blocks está listo; los recursos siguen cargando en segundo plano
// (una narración que aún no haya cargado simplemente no suena; el cielo aparece cuando llega).
startBtn.disabled = false;
app.preload().then(() => dlog('Recursos cargados')).catch((e) => console.warn('[LIQUEN] Precarga incompleta', e));

startBtn.addEventListener('click', () => {
  if (starting) return;
  // 1) Primero la sesión XR: requestSession debe ocurrir dentro del gesto del usuario.
  if (xrSupported && mgr && !mgr.currentSession) {
    try { starting = true; startBtn.disabled = true; mgr.startSession(); dlog('Solicitando sesión XR…'); }
    catch (e) { starting = false; startBtn.disabled = false; console.warn('[LIQUEN] No se pudo iniciar WebXR:', e?.message || e); }
  }
  // 2) Después el audio, protegido para que un error nunca bloquee la entrada.
  try { app.audio.unlock(); } catch (e) { console.warn('[LIQUEN] Audio no disponible', e); }
  // 3) Sin WebXR (escritorio): simulador de XR Blocks.
  if (!xrSupported) { landing.classList.add('hidden'); app.begin(); }
});
</script>
